name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: >-
          platform-tools
          platforms;android-34
          platforms;android-33
          build-tools;34.0.0

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Generate Gradle Wrapper
      working-directory: android
      run: |
        # Remove existing potentially broken wrapper
        rm -f gradlew gradlew.bat
        rm -rf gradle/wrapper
        # Generate fresh wrapper
        gradle wrapper --gradle-version 8.2

    - name: Verify Build Environment
      working-directory: android
      run: |
        echo "=== Environment ==="
        java -version
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls $ANDROID_HOME/platforms/ 2>/dev/null
        echo "=== Gradle Wrapper ==="
        ls -la gradlew
        ls -la gradle/wrapper/
        ./gradlew --version

    - name: Build Debug APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

    - name: Upload Build Log (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: android/build-log.txt

    - name: Check Debug APK
      working-directory: android
      run: |
        echo "=== Checking Debug APK ==="
        ls -la app/build/outputs/apk/debug/ || echo "Directory not found"

    - name: Upload Debug APK
      if: success()
      working-directory: android
      uses: actions/upload-artifact@v4
      with:
        name: 悬浮提词器-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
