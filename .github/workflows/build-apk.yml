name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: >-
          platform-tools
          platforms;android-34
          platforms;android-33
          build-tools;34.0.0
          build-tools;33.0.2

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Verify Gradle Setup
      working-directory: android
      run: |
        echo "=== Checking Gradle ==="
        gradle --version
        echo "=== Checking Java ==="
        java -version
        echo "=== Checking Android SDK ==="
        echo $ANDROID_HOME
        ls $ANDROID_HOME 2>/dev/null || echo "No ANDROID_HOME"

    - name: Generate Gradle Wrapper
      working-directory: android
      run: |
        ls -la gradle/wrapper/ 2>/dev/null || echo "No gradle wrapper directory"
        gradle wrapper --gradle-version 8.2

    - name: Build Debug APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

    - name: Upload Build Log (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: android/build-log.txt

    - name: Check Debug APK files
      working-directory: android
      run: |
        echo "=== Checking Debug APK files ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug directory not found"
        find app/build/outputs/apk/debug/ -name "*.apk" -type f 2>/dev/null || echo "No debug APK found"

    - name: Build Release APK
      working-directory: android
      run: |
        ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log-release.txt

    - name: Check Release APK files
      working-directory: android
      run: |
        echo "=== Checking Release APK files ==="
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "Release directory not found"
        find app/build/outputs/apk/release/ -name "*.apk" -type f 2>/dev/null || echo "No release APK found"

    - name: Upload Debug APK
      if: success()
      working-directory: android
      uses: actions/upload-artifact@v4
      with:
        name: 悬浮提词器-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Upload Release APK
      if: success()
      working-directory: android
      uses: actions/upload-artifact@v4
      with:
        name: 悬浮提词器-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: ignore
