name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: >-
          platform-tools
          platforms;android-34
          build-tools;34.0.0

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: Build Debug APK with Gradle
      working-directory: android
      run: |
        gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt
        echo "EXIT_CODE=$?"

    - name: Check APK Output
      working-directory: android
      run: |
        echo "=== Checking for APK ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug dir not found"

    - name: Upload Build Log (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: android/build-log.txt

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: 悬浮提词器-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
