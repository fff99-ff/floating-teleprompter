name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Verify Gradle
      run: |
        gradle --version
        which gradle

    - name: Build Debug APK
      working-directory: android
      run: |
        set -o pipefail
        gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log
        echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}"

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: android/build-output.log

    - name: Check APK exists
      working-directory: android
      run: |
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "APK found: $(ls -lh app/build/outputs/apk/debug/app-debug.apk)"
        else
          echo "APK NOT found!"
          cat build-output.log
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: 悬浮提词器-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
