name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Generate Gradle Wrapper
      working-directory: android
      run: gradle wrapper --gradle-version 8.2

    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build-log.txt

    - name: Upload Build Log (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: android/build-log.txt

    - name: Check APK files
      working-directory: android
      run: |
        echo "=== Checking APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found with find"
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug directory not found"
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "Release directory not found"
        echo "=== Build output structure ==="
        find app/build -type f 2>/dev/null | head -50 || echo "No build output"

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 悬浮提词器-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
