<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .teleprompter {
      position: fixed;
      inset: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .teleprompter-content {
      position: absolute;
      left: 0;
      right: 0;
      padding: 35vh 16px 35vh 16px;
      will-change: transform;
      white-space: pre-wrap;
      word-wrap: break-word;
      text-align: center;
      font-weight: 500;
    }

    .reading-guide {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 35%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      pointer-events: none;
      z-index: 5;
    }

    .start-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s;
    }

    .start-hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div class="teleprompter" id="teleprompter">
    <div class="reading-guide"></div>
    <pre class="teleprompter-content" id="content"></pre>
    <div class="start-hint" id="startHint">
      <div style="font-size:32px;margin-bottom:8px;">▶</div>
      <div>点击播放，开始朗读即可滚动</div>
    </div>
  </div>

  <script>
    var state = {
      isPlaying: false,
      scrollPos: 0,
      config: null,
      viewHeight: 0,
      totalHeight: 0
    };

    var content = document.getElementById('content');
    var teleprompter = document.getElementById('teleprompter');
    var startHint = document.getElementById('startHint');

    // ==================== Android 桥接 ====================
    window.AndroidBridge = {
      init: function(config) {
        state.config = config;
        applyConfig(config);
        if (window.Android && window.Android.log) {
          window.Android.log('Init: textLen=' + (config.script || '').length);
        }
      },

      play: function() {
        state.viewHeight = teleprompter.clientHeight;
        state.totalHeight = content.scrollHeight;
        if (state.scrollPos >= state.totalHeight - state.viewHeight && state.scrollPos > 0) {
          state.scrollPos = 0;
        }
        state.isPlaying = true;
        startHint.classList.add('hidden');
        startRenderLoop();
        if (window.Android && window.Android.log) {
          window.Android.log('Play: viewH=' + state.viewHeight + ' totalH=' + state.totalHeight);
        }
      },

      pause: function() {
        state.isPlaying = false;
      },

      // 由原生音量检测驱动：speed 为每帧滚动像素
      scroll: function(speed) {
        if (!state.isPlaying) return;
        state.scrollPos += speed;
        var maxScroll = Math.max(0, state.totalHeight - state.viewHeight);
        if (state.scrollPos >= maxScroll) {
          state.scrollPos = maxScroll;
          state.isPlaying = false;
          if (window.Android && window.Android.onPlaybackEnded) {
            window.Android.onPlaybackEnded();
          }
        }
      },

      updateConfig: function(config) {
        state.config = config;
        applyConfig(config);
      }
    };

    function applyConfig(config) {
      content.style.fontSize = config.fontSize + 'px';
      content.style.color = config.fontColor;
      content.style.lineHeight = config.lineHeight;
      content.textContent = config.script || '';

      var rgba = hexToRgba(config.bgColor, config.bgOpacity);
      document.body.style.backgroundColor = rgba;
      teleprompter.style.backgroundColor = rgba;

      content.style.transform = config.mirror ? 'scaleX(-1)' : '';

      setTimeout(function() {
        state.viewHeight = teleprompter.clientHeight;
        state.totalHeight = content.scrollHeight;
      }, 100);
    }

    function hexToRgba(hex, alpha) {
      var r = parseInt(hex.slice(1, 3), 16);
      var g = parseInt(hex.slice(3, 5), 16);
      var b = parseInt(hex.slice(5, 7), 16);
      return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
    }

    // ==================== 渲染循环 ====================
    var animFrame = null;
    function startRenderLoop() {
      if (animFrame) return;
      function loop() {
        var mirror = state.config && state.config.mirror;
        content.style.transform = 'translateY(-' + state.scrollPos + 'px)' + (mirror ? ' scaleX(-1)' : '');
        animFrame = requestAnimationFrame(loop);
      }
      animFrame = requestAnimationFrame(loop);
    }

    // ==================== 窗口大小变化 ====================
    window.addEventListener('resize', function() {
      state.viewHeight = teleprompter.clientHeight;
      state.totalHeight = content.scrollHeight;
    });
  </script>
</body>
</html>
